<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ثبّت Masr Drive</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0d1117">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#0d1117;color:#e6edf3;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;line-height:1.7}
main{max-width:380px;width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
img{width:96px;height:96px;border-radius:22px}
p{color:#8b949e}
button,.play{border:0;border-radius:12px;padding:14px 22px;font-size:18px;font-weight:600;color:#fff;background:#2f81f7;width:100%;text-decoration:none;display:block}
.play{background:transparent;border:1px solid #2a313c;color:#e6edf3;font-size:16px}
#msg{min-height:24px;font-size:15px}
[hidden]{display:none!important}
</style></head><body>
<main>
 <img src="icon-192.png" alt="Masr Drive">
 <h1>Masr Drive</h1>
 <p>ثبّت اللعبة على موبايلك وافتحها زي أي تطبيق، وتشتغل حتى من غير نت.</p>
 <button id="ins">⬇ تثبيت</button>
 <p id="msg"></p>
</main>
<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
var dp=null,ins=document.getElementById('ins'),msg=document.getElementById('msg');
var done=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(done){ins.hidden=true;msg.textContent='اللعبة مثبّتة عندك بالفعل ✅'}
addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e});
addEventListener('appinstalled',function(){ins.hidden=true;msg.textContent='تم التثبيت ✅ هتلاقيها على الشاشة الرئيسية'});
ins.onclick=function(){
 if(!dp){msg.innerHTML='<a class="play" href="./">🔗 اضغط هنا لتحميل اللعبة</a>';return}
 dp.prompt();dp.userChoice.then(function(r){dp=null;msg.textContent=r.outcome==='accepted'?'تم التثبيت ✅ هتلاقيها على الشاشة الرئيسية':'ماتثبتتش. تقدر تدوس تاني.'})};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script></body></html>
